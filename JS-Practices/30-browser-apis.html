
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Browser APIs</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 750px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        section {
            background: white;
            padding: 20px;
            margin: 18px 0;
            border-radius: 10px;
        }

        button {
            padding: 10px 16px;
            margin: 5px;
            cursor: pointer;
        }

        #status {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <h1>JavaScript Browser APIs</h1>

    <!-- 1. Clipboard API -->
    <section>
        <h2>1. Clipboard API</h2>

        <input id="copyText" value="Learning JavaScript Browser APIs!">

        <button id="copyButton">Copy Text</button>
        <button id="pasteButton">Read Clipboard</button>

        <p id="clipboardStatus" role="status"></p>
    </section>

    <!-- 2. Geolocation API -->
    <section>
        <h2>2. Geolocation API</h2>

        <button id="locationButton">Get My Location</button>

        <p id="locationStatus" role="status">
            Location not requested.
        </p>
    </section>

    <!-- 3. Online / Offline Detection -->
    <section>
        <h2>3. Network Status</h2>

        <p id="networkStatus"></p>
    </section>

    <!-- 4. Web Share API -->
    <section>
        <h2>4. Web Share API</h2>

        <button id="shareButton">Share This Page</button>

        <p id="shareStatus" role="status"></p>
    </section>

    <!-- 5. Vibration API -->
    <section>
        <h2>5. Vibration API</h2>

        <button id="vibrateButton">Test Vibration</button>

        <p id="vibrationStatus"></p>
    </section>

    <script>
        // 1. Clipboard API

        const copyText = document.getElementById("copyText");
        const clipboardStatus = document.getElementById("clipboardStatus");

        document.getElementById("copyButton").addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(copyText.value);
                clipboardStatus.textContent = "Text copied successfully!";
            } catch (error) {
                clipboardStatus.textContent = "Clipboard access failed.";
                console.error(error);
            }
        });

        document.getElementById("pasteButton").addEventListener("click", async () => {
            try {
                const text = await navigator.clipboard.readText();
                clipboardStatus.textContent = `Clipboard: ${text}`;
            } catch (error) {
                clipboardStatus.textContent =
                    "Could not read clipboard. Check browser permissions.";
                console.error(error);
            }
        });


        // 2. Geolocation API

        const locationStatus = document.getElementById("locationStatus");

        document.getElementById("locationButton").addEventListener("click", () => {
            if (!navigator.geolocation) {
                locationStatus.textContent =
                    "Geolocation is not supported by this browser.";
                return;
            }

            locationStatus.textContent = "Requesting location permission...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const latitude = position.coords.latitude;
                    const longitude = position.coords.longitude;

                    locationStatus.textContent =
                        `Latitude: ${latitude}, Longitude: ${longitude}`;
                },

                (error) => {
                    locationStatus.textContent =
                        `Location error: ${error.message}`;
                },

                {
                    enableHighAccuracy: true,
                    timeout: 10000,
                    maximumAge: 0
                }
            );
        });


        // 3. Online / Offline Detection

        const networkStatus = document.getElementById("networkStatus");

        function updateNetworkStatus() {
            networkStatus.textContent = navigator.onLine
                ? "You are currently online."
                : "You are currently offline.";
        }

        window.addEventListener("online", updateNetworkStatus);
        window.addEventListener("offline", updateNetworkStatus);

        updateNetworkStatus();


        // 4. Web Share API

        const shareStatus = document.getElementById("shareStatus");

        document.getElementById("shareButton").addEventListener("click", async () => {
            const shareData = {
                title: "JavaScript Browser APIs",
                text: "Learning modern JavaScript browser APIs!",
                url: window.location.href
            };

            try {
                if (navigator.share) {
                    await navigator.share(shareData);
                    shareStatus.textContent = "Share action completed.";
                } else {
                    await navigator.clipboard.writeText(shareData.url);
                    shareStatus.textContent =
                        "Sharing is unavailable. Page URL copied instead.";
                }
            } catch (error) {
                if (error.name === "AbortError") {
                    shareStatus.textContent = "Sharing cancelled.";
                } else {
                    shareStatus.textContent = "Unable to share.";
                    console.error(error);
                }
            }
        });


        // 5. Vibration API

        const vibrationStatus = document.getElementById("vibrationStatus");

        document.getElementById("vibrateButton").addEventListener("click", () => {
            if ("vibrate" in navigator) {
                const success = navigator.vibrate([200, 100, 200]);

                vibrationStatus.textContent = success
                    ? "Vibration requested."
                    : "Vibration could not be started.";
            } else {
                vibrationStatus.textContent =
                    "Vibration is not supported on this device.";
            }
        });
    </script>
</body>
</html>
