
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fetch API Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background: #2563eb;
            color: white;
        }

        .user-card {
            background: white;
            padding: 15px;
            margin-top: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 5px #00000015;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>Fetch API Practice</h1>
    <p>Retrieve users from an API and display them below.</p>

    <button id="loadUsers">Load Users</button>

    <p id="status" role="status"></p>
    <div id="userList"></div>

    <script>
        const loadButton = document.getElementById("loadUsers");
        const status = document.getElementById("status");
        const userList = document.getElementById("userList");

        async function fetchUsers() {
            status.textContent = "Loading users...";
            userList.replaceChildren();
            loadButton.disabled = true;

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                // fetch() does not throw automatically for HTTP errors.
                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                const users = await response.json();

                users.forEach((user) => {
                    const card = document.createElement("div");
                    card.className = "user-card";

                    const name = document.createElement("h3");
                    name.textContent = user.name;

                    const email = document.createElement("p");
                    email.textContent = `Email: ${user.email}`;

                    const city = document.createElement("p");
                    city.textContent = `City: ${user.address.city}`;

                    card.append(name, email, city);
                    userList.appendChild(card);
                });

                status.textContent = `Loaded ${users.length} users successfully.`;
            } catch (error) {
                status.textContent = `Failed to load users: ${error.message}`;
            } finally {
                loadButton.disabled = false;
            }
        }

        loadButton.addEventListener("click", fetchUsers);
    </script>
</body>
</html>
