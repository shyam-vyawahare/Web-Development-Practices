
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Search and Filter Practice</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 15px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .user-card {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
        }

        #status {
            color: #555;
        }
    </style>
</head>
<body>
    <h1>Search and Filter Users</h1>

    <input
        type="text"
        id="searchInput"
        placeholder="Search by name, email, or city..."
        aria-label="Search users"
    >

    <p id="status" role="status">Loading users...</p>
    <div id="userList"></div>

    <script>
        const searchInput = document.getElementById("searchInput");
        const status = document.getElementById("status");
        const userList = document.getElementById("userList");

        let users = [];

        async function loadUsers() {
            status.textContent = "Loading users...";

            try {
                const response = await fetch(
                    "https://jsonplaceholder.typicode.com/users"
                );

                if (!response.ok) {
                    throw new Error(`HTTP Error: ${response.status}`);
                }

                users = await response.json();
                renderUsers(users);
            } catch (error) {
                status.textContent = `Failed to load users: ${error.message}`;
            }
        }

        function renderUsers(filteredUsers) {
            userList.replaceChildren();

            status.textContent =
                `${filteredUsers.length} user(s) found.`;

            if (filteredUsers.length === 0) {
                status.textContent = "No matching users found.";
                return;
            }

            filteredUsers.forEach((user) => {
                const card = document.createElement("div");
                card.className = "user-card";

                const name = document.createElement("h3");
                name.textContent = user.name;

                const email = document.createElement("p");
                email.textContent = `Email: ${user.email}`;

                const city = document.createElement("p");
                city.textContent = `City: ${user.address.city}`;

                card.append(name, email, city);
                userList.appendChild(card);
            });
        }

        function filterUsers() {
            const query = searchInput.value.trim().toLowerCase();

            const filteredUsers = users.filter((user) => {
                return (
                    user.name.toLowerCase().includes(query) ||
                    user.email.toLowerCase().includes(query) ||
                    user.address.city.toLowerCase().includes(query)
                );
            });

            renderUsers(filteredUsers);
        }

        searchInput.addEventListener("input", filterUsers);

        loadUsers();
    </script>
</body>
</html>
